# Existing Learn project/UI plus its free API. Never select paid compute plans.
# Database: owner-approved isolated learn_studio database + restricted role on
# existing free agiler-pg-pp. DATABASE_URL is configured privately, not as the
# shared instance's administrative connection string. Do not manage/move that
# Agiler instance from this Blueprint. Its free-tier expiry still applies.
previews:
  generation: off

projects:
  - name: Learn
    environments:
      - name: production
        services:
          - type: web
            name: learn-with-saravana
            runtime: static
            branch: main
            buildCommand: "npm ci --include=dev && npm run build"
            staticPublishPath: dist
            autoDeployTrigger: checksPass
            routes:
              - type: rewrite
                source: /api/*
                destination: https://learn-with-saravana-api.onrender.com/api/*
          - type: web
            name: learn-with-saravana-api
            runtime: python
            branch: main
            plan: free
            region: singapore
            buildCommand: pip install -r backend/requirements.txt
            startCommand: "uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
            healthCheckPath: /api/health
            autoDeployTrigger: checksPass
            envVars:
              - key: PYTHON_VERSION
                value: 3.12.10
              - key: APP_ENV
                value: production
              - key: APP_ORIGIN
                value: https://learn-with-saravana.onrender.com
              - key: DATABASE_URL
                sync: false
              - key: BOOTSTRAP_ADMIN_PASSWORD
                sync: false
              - key: GUEST_PASSWORD
                sync: false
