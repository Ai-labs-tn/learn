# Render Blueprint for Learn with Saravana (https://render.com/docs/blueprint-spec)
#
# The simulators are 100% client-side, so today only the static site is deployed.
# The app uses hash routing (#/track), so no SPA rewrite rules are needed.
# Static sites are served from Render's global CDN (region is not selectable) — that is the
# fastest option for learners in India. A fixed region would require a paid web service.
# Blueprint sync creates the "Learn" project and places the service inside it.
# When auth / lesson tracking lands, re-add the API + database blocks kept below.

projects:
  - name: Learn

services:
  - type: web
    name: learn-with-saravana
    project: Learn
    runtime: static
    buildCommand: "npm ci --include=dev && npm run build"
    staticPublishPath: dist
    pullRequestPreviewsEnabled: yes

