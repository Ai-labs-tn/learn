# Render Blueprint for Learn with Saravana
# (https://render.com/docs/blueprint-spec — projects/environments pattern)
#
# Applying this Blueprint creates the "Learn" project with the static site inside it, at
# https://learn-with-saravana.onrender.com, auto-deploying from main.
#
# The simulators are 100% client-side, so only the static site ships today. Static sites are
# served from Render's global CDN (region is not selectable — that is the fastest option for
# learners in India; a fixed region would require a paid web service). The future API service
# (auth/lesson progress) is pre-noted below with region: singapore for when it lands.

previews:
  generation: off

projects:
  - name: Learn
    environments:
      - name: production
        services:
          - type: web
            name: learn-with-saravana
            runtime: static
            buildCommand: "npm ci --include=dev && npm run build"
            staticPublishPath: dist
            pullRequestPreviewsEnabled: yes

