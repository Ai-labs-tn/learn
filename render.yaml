services:
  - type: web
    name: learn-with-saravana-api
    runtime: python
    rootDir: backend
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.0
      - key: DATABASE_URL
        fromDatabase:
          name: learn-with-saravana-db
          property: connectionString
  - type: web
    name: learn-with-saravana
    runtime: static
    buildCommand: "npm ci && npm run build"
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: /api
databases:
  - name: learn-with-saravana-db
    plan: free
