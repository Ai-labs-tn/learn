name: Learning Studio acceptance
on:
  push:
    branches: [main, learning-studio]
  pull_request:
    branches: [main, learning-studio]
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: acceptance
          POSTGRES_PASSWORD: disposable-ci-only
          POSTGRES_DB: learn_acceptance
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Use public GitHub HTTPS for UI dependency
        run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      - run: npm ci --include=dev
      - run: npm run build
      - run: npm run audit:security
      - name: Production dependencies are sufficient to import the API
        # Render installs backend/requirements.txt only. Dev-only packages (httpx, pytest)
        # must not mask a missing runtime dependency.
        run: |
          python -m venv /tmp/prod-venv
          /tmp/prod-venv/bin/pip install -r backend/requirements.txt
          /tmp/prod-venv/bin/python -c "import backend.main"
      - run: pip install -r backend/requirements-dev.txt
      - run: pip check
      - name: Backend functional and real PostgreSQL acceptance
        env:
          TEST_POSTGRES_URL: postgresql+psycopg://acceptance:disposable-ci-only@127.0.0.1:5432/learn_acceptance
        run: python -m pytest backend -q --junitxml=acceptance-tests/phase-05/backend/ci-junit.xml
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Chromium (fast path; apt fallback only if it cannot launch)
        # `--with-deps` also apt-installs fonts from a mirror that is sometimes very slow
        # (one run stalled for 7+ minutes). The runner image already provides Chrome's system
        # libraries, so try the browser alone first and fall back to the full install.
        timeout-minutes: 10
        run: |
          npx playwright install chromium
          node -e "require('@playwright/test').chromium.launch().then(b => b.close()).then(() => console.log('chromium launches'))" \
            || npx playwright install --with-deps chromium
      - name: Start isolated browser-test API
        env:
          APP_ENV: test
          APP_ORIGIN: http://127.0.0.1:5173
          DATABASE_URL: sqlite:////tmp/learn-browser-acceptance.db
          BOOTSTRAP_ADMIN_PASSWORD: LocalAdmin123!Only
          GUEST_PASSWORD: LocalGuest123!Only
          LOGIN_LIMIT: '200'
        run: |
          python -m uvicorn backend.main:app --host 127.0.0.1 --port 8000 > /tmp/learn-acceptance-api.log 2>&1 &
          python - <<'PY'
          import time, urllib.request
          for attempt in range(30):
              try:
                  urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2)
                  break
              except Exception:
                  time.sleep(1)
          else:
              raise SystemExit('API failed to become ready')
          PY
      - run: npm run test:acceptance
        env:
          LEARN_EVIDENCE_DIR: acceptance-tests/phase-05/frontend
      - name: Verify Docker image builds
        run: docker build -t learn-studio-acceptance .
      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-05-acceptance
          path: |
            acceptance-tests/phase-05/backend/*junit.xml
            acceptance-tests/phase-05/frontend/browser-results.xml
            acceptance-tests/phase-05/frontend/screenshots/
          retention-days: 7
